# Every property used in resource files must also be listed in expandProps in buildSrc/.../multiloader-common.gradle.

# Project
version=0.1.0
group=com.desktopscreens
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
mod_name=Desktop Screens
mod_author=MagiMigi
mod_id=desktopscreens
license=MIT
description=Use your real PC desktop inside Minecraft, on screens you build or on a tablet you carry.
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.19.5
# Oldest loader players may use. Kept low on purpose: modpacks often lag behind the latest.
fabric_loader_min=0.16.0
# https://modrinth.com/mod/modmenu (optional; only for the settings button in the Fabric mods list)
modmenu_version=11.0.4

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=21.1.251
# Oldest NeoForge players may use. Kept low on purpose: modpacks often lag behind the latest.
neoforge_version_range=[21.1.0,)
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.configuration-cache=false
